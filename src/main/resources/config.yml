  no-permission: '&cYou do not have permission to use this command.'
  player-only: '&cYou must be a player to use ''hand''.'
  no-cmd-in-hand: '&cThe item in your hand has no CustomModelData.'
  invalid-cmd: '&cInvalid CustomModelData value: &f{value}'
  invalid-multipliers: '&cInvalid multipliers. Use numbers (e.g. 1.5).'
  skin-saved: '&aSkin &f{cmd} &a({name}) saved successfully.'
  skin-saved-values: '&7  Essence: &f{essence}x &7| Money: &f{money}x &7| ToolXP: &f{toolxp}x &7| CyberXP: &f{cyberxp}x'
  skin-clamped: '&eSome multipliers were reduced to the configured maximum.'
  skin-removed: '&aSkin &f{cmd} removed successfully.'
  skin-not-found: '&cNo skin registered with CMD &f{cmd}&c.'
  no-skins: '&7No skins registered.'
  list-header: '&6=== Registered Skins ({count}) ==='
  list-limits: '&7Limits — E:&f{essence} &7M:&f{money} &7TX:&f{toolxp} &7CX:&f{cyberxp}'
  list-entry: '&e{cmd} &7— &f{name} &7| E:&f{essence}x &7M:&f{money}x &7TX:&f{toolxp}x &7CX:&f{cyberxp}x'
  reload-done: '&aConfiguration reloaded. &7({count} skins)'
  info-not-found: '&7No boost registered for CMD &f{cmd}&7.'
  info-header: '&6CMD &f{cmd} &7— &f{name}'
  info-essence: '&7  Essence:  &f{value}x'
  info-money: '&7  Money:    &f{value}x'
  info-toolxp: '&7  Tool XP:  &f{value}x'
  info-cyberxp: '&7  Cyber XP: &f{value}x'
  usage-set: '&eUsage: &f/skinboost set <cmd|hand> [name] <essence> <money> <tool-xp> <cyber-xp>'
  usage-set-example: '&7Example: &f/skinboost set 1001 1.5 1.2 1.5 1.3'
  usage-remove: '&eUsage: &f/skinboost remove <cmd>'
  usage-info: '&eUsage: &f/skinboost info <cmd>'
  help-header: '&6=== SkinBoosts Commands ==='
  help-set: '&e/skinboost set <cmd|hand> [name] <essence> <money> <tool-xp> <cyber-xp>'
  help-remove: '&e/skinboost remove <cmd>'
  help-list: '&e/skinboost list'
  help-info: '&e/skinboost info [cmd]'
  usage-apply: '&eUsage: &f/skinboost apply <cmd> [player]'
  usage-apply-console: '&eConsole usage: &f/skinboost apply <cmd> <player>'
  apply-no-item: '&cThe player has no item in hand.'
  apply-done: '&aCustomModelData &f{cmd} &aapplied to &f{player}&a''s item.'
  apply-done-target: '&aYour item received CustomModelData &f{cmd}&a.'
