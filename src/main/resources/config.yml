# SkinBoosts Configuration
# Multipliers are applied ON TOP of base values (1.0 = no change, 2.0 = double, etc.)
#
# Available multiplier keys:
#   essence    - RivalHarvesterHoes essence drops
#   money      - Economy money drops
#   tool-xp    - RivalHarvesterHoes tool XP
#   cyber-xp   - CyberLevels XP

skins:
  # CustomModelData 1001 -> "Pico de Fuego"
  1001:
    name: '&cPico de Fuego'
    multipliers:
      essence: 1.5
      money: 1.2
      tool-xp: 1.5
      cyber-xp: 1.3

  # CustomModelData 1002 -> "Pico de Hielo"
  1002:
    name: '&bPico de Hielo'
    multipliers:
      essence: 2.0
      money: 1.5
      tool-xp: 2.0
      cyber-xp: 1.5

  # CustomModelData 1003 -> "Pico Sombra"
  1003:
    name: '&5Pico Sombra'
    multipliers:
      essence: 3.0
      money: 2.0
      tool-xp: 3.0
      cyber-xp: 2.5

# Maximum allowed value for each multiplier.
# If a skin exceeds these values it will be clamped automatically.
# Set to 0.0 to disable the limit for that type.
max-multipliers:
  essence: 5.0
  money: 5.0
  tool-xp: 5.0
  cyber-xp: 5.0

# Particles shown when a boost triggers (true/false)
show-particles: true

# Prefix for plugin messages
prefix: '&8[&6SkinBoosts&8] &r'