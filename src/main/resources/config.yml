# ---------------------------------------------------------------
#  REFERENCE — Commands & Placeholders (do not edit this section)
# ---------------------------------------------------------------
#
# COMMANDS (permission: skinboosts.admin)
#
#   /skinboost set <cmd|hand> [name] <essence> <money> <tool-xp> <cyber-xp>
#       Registers a skin boost by CustomModelData or reads CMD from hand.
#       Name is optional. Example: /skinboost set 1001 1.5 1.2 1.5 1.3
#
#   /skinboost remove <cmd>
#       Removes a registered skin boost.
#
#   /skinboost list
#       Lists all registered skins and active limits.
#
#   /skinboost info [cmd]
#       Shows multipliers for a CMD, or reads CMD from hand if omitted.
#
#   /skinboost apply <cmd> [player]
#       Applies a CustomModelData to the item in hand.
#       Player is optional in-game, required from console.
#
#   /skinboost reset [player]
#       Removes the CustomModelData from the item in hand and deletes its boost.
#       Player is optional in-game, required from console.
#
#   /skinboost reload
#       Reloads config.yml without restarting the server.
#
# ---------------------------------------------------------------
#
# PLACEHOLDERS (requires PlaceholderAPI)
#
#   %skinboosts_essence%      Essence multiplier (e.g. 1.50)
#   %skinboosts_money%        Money multiplier
#   %skinboosts_toolxp%       Tool XP multiplier
#   %skinboosts_cyberxp%      Cyber XP multiplier
#   %skinboosts_essence_fmt%  Essence multiplier with x prefix (e.g. x1.50)
#   %skinboosts_money_fmt%    Money multiplier with x prefix
#   %skinboosts_toolxp_fmt%   Tool XP multiplier with x prefix
#   %skinboosts_cyberxp_fmt%  Cyber XP multiplier with x prefix
#   %skinboosts_name%         Display name of the active skin, or "None"
#   %skinboosts_cmd%          Raw CustomModelData int, or -1 if none
#   %skinboosts_active%       true / false
#
#   All placeholders read the item currently in the player's main hand.
#   Returns default values (1.00 / false / None) if no boost is registered.
#
# ---------------------------------------------------------------